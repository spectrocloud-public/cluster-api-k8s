# Adds namespace to all resources.
namespace: capi-webhook-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: cabpck-bootstrap-

# Labels to add to all resources and selectors.
commonLabels:
  cluster.x-k8s.io/provider: "bootstrap-ck8s"

resources:
  - ../../../bootstrap/config/crd
  #  - ../../../bootstrap/config/default
  - ../../../bootstrap/config/manager
  # [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
  # crd/kustomization.yaml
  - ../../../bootstrap/config/webhook
  # [CERTMANAGER] To enable cert-manager, uncomment all sections with 'CERTMANAGER'. 'WEBHOOK' components are required.
  - ../../../bootstrap/config/certmanager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus

patchesStrategicMerge:
  # Protect the /metrics endpoint by putting it behind auth.
  # If you want your controller-manager to expose the /metrics
  # endpoint w/o any authn/z, please comment the following line.
  - ../../../bootstrap/config/default/manager_auth_proxy_patch.yaml

  # [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
  # crd/kustomization.yaml
  - ../../../bootstrap/config/default/manager_webhook_patch.yaml

  # [CERTMANAGER] To enable cert-manager, uncomment all sections with 'CERTMANAGER'.
  # Uncomment 'CERTMANAGER' sections in crd/kustomization.yaml to enable the CA injection in the admission webhooks.
  # 'CERTMANAGER' needs to be enabled to use ca injection
  - ../../../bootstrap/config/default/webhookcainjection_patch.yaml

patches:
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: ENABLE_WEBHOOKS
            value: "true"
  - target:
      kind: Deployment
      name: controller-manager
      namespace: system
    patch: |-
      - op: remove
        path: /spec/template/spec/serviceAccountName
  - path: delete-namespace.yaml
    target:
      kind: Namespace
      name: system
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
      namespace: system
    patch: |
        - op: replace
          path: /spec/template/spec/containers/0/args/1
          value: --enable-leader-election=false
  - target:
      kind: Deployment
      name: controller-manager
      namespace: system
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/master
            effect: NoSchedule
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule

# the following config is for teaching kustomize how to do var substitution
# [CERTMANAGER] To enable cert-manager, uncomment all sections with 'CERTMANAGER' prefix.
configurations:
  - ../../../bootstrap/config/certmanager/kustomizeconfig.yaml
  - ../../../bootstrap/config/default/kustomizeconfig.yaml
vars:
  - name: CERTIFICATE_NAMESPACE # namespace of the certificate CR
    objref:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert # this name should match the one in certificate.yaml
    fieldref:
      fieldpath: metadata.namespace
  - name: CERTIFICATE_NAME
    objref:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert # this name should match the one in certificate.yaml
  - name: SERVICE_NAMESPACE # namespace of the service
    objref:
      kind: Service
      version: v1
      name: webhook-service
    fieldref:
      fieldpath: metadata.namespace
  - name: SERVICE_NAME
    objref:
      kind: Service
      version: v1
      name: webhook-service
