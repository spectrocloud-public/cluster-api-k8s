# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: cacpck-

patches:
- path: ../../../controlplane/config/default/manager_auth_proxy_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
    namespace: system
- path: delete-namespace.yaml
  target:
    kind: Namespace
    name: system
- target:
    kind: Deployment
    name: controller-manager
    namespace: system
  patch: |-
    - op: remove
      path: /spec/template/spec/serviceAccountName
- target:
    kind: Deployment
    name: controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/1/env
      value:
        - name: ENABLE_WEBHOOKS
          value: "false"
- target:
    kind: Deployment
    name: controller-manager
    namespace: system
  patch: |
    - op: add
      path: /spec/template/spec/containers/1/args/1
      value: --sync-period=2m
- target:
    kind: Deployment
    name: controller-manager
    namespace: system
  patch: |-
    - op: add
      path: /spec/template/spec/tolerations
      value:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule

# the following config is for teaching kustomize how to do var substitution
# [CERTMANAGER] To enable cert-manager, uncomment all sections with 'CERTMANAGER' prefix.
configurations:
- ../../../controlplane/config/default/kustomizeconfig.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../controlplane/config/manager
# Labels to add to all resources and selectors.
labels:
- includeSelectors: true
  pairs:
    cluster.x-k8s.io/provider: control-plane-ck8s
